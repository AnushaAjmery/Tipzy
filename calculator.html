div><label for="o4">Utilities</label><input id="o4" type="number" min="0" inputmode="numeric"></div><div><label for="o5">Misc</label><input id="o5" type="number" min="0" inputmode="numeric"></div></div><h2>Startup cost (Rs)</h2><div><label for="s0">Startup cost</label><input id="s0" type="number" min="0" inputmode="numeric"></div><br><button class="btn alt" type="button" id="reset">Reset to defaults</button></form><h2 style="margin-top:30px">Results</h2><div class="res" aria-live="polite"><div>Total sales<b id="r-sales"></b></div><div>Other expenses<b id="r-other"></b></div><div>Total expenses<b id="r-exp"></b></div><div>Profit<b id="r-profit"></b></div><div>Margin<b id="r-margin"></b></div><div>Break-even sales<b id="r-be"></b></div><div>Payback<b id="r-pay"></b></div></div></div></section></main><div id="site-footer"></div><script src="script.js"></script></body></html>
